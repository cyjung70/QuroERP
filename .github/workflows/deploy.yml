name: Dev CI and deployment

# dev push/병합에서 실행합니다. PR 코드는 배포 러너에 전달하지 않습니다.
# push 이벤트이므로 이 변경을 main에 다시 반영하지 않아도 dev에서 실행됩니다.
on:
  push:
    branches: [dev]

# checkout 읽기 권한만 필요합니다. SSH/이미지 레지스트리는 사용하지 않습니다.
permissions:
  contents: read

# 개발 배포를 직렬 실행하며 진행 중인 마이그레이션은 취소하지 않습니다.
concurrency:
  group: quroerp-dev-deploy
  cancel-in-progress: false

jobs:
  verify:
    # GitHub 호스팅 Ubuntu에서 기존 CI를 실행합니다. 개발 DB Secret은 전달하지 않습니다.
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    # 세 라벨을 모두 가진 기존 Linux 러너를 선택합니다.
    # 서비스 계정은 Docker, Compose v2, Bash, curl, flock 실행 권한이 필요합니다.
    runs-on: [self-hosted, linux, quroerp-deploy]
    timeout-minutes: 45
    # Settings → Environments → dev에서 배포 브랜치를 dev로 제한합니다.
    environment: dev
    defaults:
      run:
        shell: bash
    env:
      # 운영 이미지/컨테이너/볼륨과 구분하는 개발 전용 이름입니다.
      IMAGE_PREFIX: quroerp-dev
      RELEASE_SHA: ${{ github.sha }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # dev 환경 Variables: 개발 웹 HTTPS 주소, 서버 설정 디렉터리입니다.
      DEPLOY_URL: ${{ vars.DEV_URL }}
      DEPLOY_DIRECTORY: ${{ vars.DEV_DEPLOY_DIRECTORY || '/opt/quroerp/dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 재사용 CI가 검증한 바로 그 커밋을 빌드합니다.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 러너 및 서버 설정 확인
        run: |
          set -euo pipefail
          if ! docker info > /dev/null; then
            echo '러너 서비스 계정의 Docker 접근 권한을 확인하세요. docker 그룹 변경 후에는 러너 서비스를 재시작해야 합니다. deploy/README.md의 권한 안내를 참고하세요.' >&2
            exit 1
          fi
          docker compose version
          command -v flock
          command -v curl
          test -r "$DEPLOY_DIRECTORY/deploy.env" || { echo '서버 deploy.env 파일을 준비하세요.' >&2; exit 1; }
          test -n "$DEPLOY_URL" || { echo 'GitHub dev 환경 Variable DEV_URL을 설정하세요.' >&2; exit 1; }
      - name: 배포 실패 처리 검증
        run: bash deploy/tests/deploy-test.sh
      - name: 검증된 커밋의 Docker 이미지 빌드
        # SDK는 Docker 안에 있습니다. 빌드 단계에는 개발 DB/JWT/TLS Secret을 주지 않습니다.
        run: |
          set -euo pipefail
          for target in api web migrate; do
            docker build --target "$target" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              -t "$IMAGE_PREFIX-$target:$IMAGE_TAG" .
          done
      - name: 외부 개발 DB 마이그레이션 및 배포
        # dev 환경 Secrets에 등록합니다. Variables에는 비밀번호를 넣지 않습니다.
        # Secret이 비어 있으면 deploy.sh가 서버 deploy.env의 같은 설정을 사용합니다.
        # 비밀 값은 이 단계의 환경변수로만 전달합니다. 명령줄/빌드 인수로 넣지 않습니다.
        env:
          DB_CONNECTION: ${{ secrets.DEV_DB_CONNECTION }}
          JWT_SIGNING_KEY: ${{ secrets.DEV_JWT_SIGNING_KEY }}
          TLS_PASSWORD: ${{ secrets.DEV_TLS_PASSWORD }}
        run: bash deploy/deploy.sh
