# 개발 전용 스택입니다. 외부 PostgreSQL을 사용하므로 DB 컨테이너/DB 볼륨은 없습니다.
# 실제 DB 접속정보는 DB_CONNECTION으로만 받습니다.
name: quroerp-dev

services:
  migrate:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      # 고정 경로 /opt/quroerp/dev/deploy.env에서만 주입합니다.
      ConnectionStrings__QuroErp: ${DB_CONNECTION:?DB_CONNECTION is required}
    # 애플리케이션 시작과 분리해 한 번 실행합니다. 실패하면 API/Web을 교체하지 않습니다.
    profiles: [tools]

  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      ConnectionStrings__QuroErp: ${DB_CONNECTION:?DB_CONNECTION is required}
      # deploy.sh가 호스트의 jwt-signing.key를 읽어 주입합니다.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Run deploy.sh or load the host jwt-signing.key}
      Kestrel__Endpoints__Http__Url: http://+:8080
    # API는 Docker 내부 전용이며 호스트 포트를 공개하지 않습니다.
    healthcheck:
      # DB 설정을 읽는 기존 API로 외부 DB 연결까지 확인합니다.
      test: [CMD-SHELL, "test \"$$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/api/auth/login-options)\" = 200"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      # Compose 서비스 이름 api로 통신합니다.
      QuroApi__BaseUrl: http://api:8080
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Certificates__Default__Path: /https/tls.pfx
      Kestrel__Certificates__Default__Password: ${TLS_PASSWORD:?TLS_PASSWORD is required}
      AllowedHosts: ${WEB_HOST:?WEB_HOST is required}
    ports:
      # 운영 443 포트와 분리한 개발 기본 포트입니다. DB 포트와는 별개입니다.
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ${TLS_DIRECTORY:?TLS_DIRECTORY is required}
        target: /https
        read_only: true
        bind:
          create_host_path: false
      # 개발 Web의 Data Protection 키를 컨테이너 교체 후에도 보존합니다.
      - web-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 내부 검사만 인증서 검증을 생략합니다. deploy.sh의 외부 HTTPS 검사는 검증합니다.
      test: [CMD-SHELL, "test \"$$(curl -ks -H \"Host: $$AllowedHosts\" -o /dev/null -w '%{http_code}' --max-time 10 https://localhost:8443/bc/login)\" = 200"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 5

volumes:
  web-keys:
